[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-text-restoration"
version = "0.1.0"
description = "Korean word-spacing (띄어쓰기) correction with a LoRA-tuned small LLM, plus data, baselines and metrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prasanjeet Keshri" }]
dependencies = []

[project.optional-dependencies]
data = ["pyarrow>=14"]
train = [
  "torch>=2.2",
  "transformers>=5.0",
  "peft>=0.17",
  "accelerate>=0.34",
  "bitsandbytes>=0.43",
]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["ktr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
